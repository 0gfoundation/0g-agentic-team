[project]
name = "agentic-team"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["httpx", "pyyaml"]

[project.scripts]
agentic_team = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_team"]
